syntax = "proto3";

// Arduino/nanopb wire schema. Field numbers are part of the deployed V1
// protocol and must never be renumbered or reused.

// Storage state: 0=disabled,1=missing,2=unformatted,3=recovering,4=ready,5=full,6=fault.
message FlashLogInfo {
  uint32 state = 1;
  uint32 jedec_id = 2;
  uint32 capacity_bytes = 3;
  uint32 usable_bytes = 4;
  uint32 used_bytes = 5;
  uint32 free_bytes = 6;
  uint32 record_count = 7;
  uint32 maximum_records = 8;
  uint32 generation = 9;
  uint32 latest_sequence = 10;
  uint32 retention_started_epoch = 11;
  uint32 next_clear_epoch = 12;
  uint32 clear_sectors_remaining = 13;
  uint32 dropped_samples = 14;
  uint32 corrupt_records = 15;
  bool busy = 16;
  bool rtc_trusted = 17;
}

// kind: 1=last,2=today. phase: 1=preparing,2=record,3=end.
// result: 0=OK,1=empty,2=not ready,3=time untrusted,4=cancelled,
// 5=retention changed,6=ACK timeout,7=read/encode failure,8=busy.
message HistoryInfo {
  uint32 request_id = 1;
  uint32 generation = 2;
  uint32 sequence = 3;
  uint32 index = 4;
  uint32 total = 5;
  uint32 day_key = 6;
  uint32 kind = 7;
  uint32 phase = 8;
  uint32 result = 9;
  bool ack_required = 10;
}

// When both flow meters are enabled, the original flow fields carry TUF for
// backward compatibility, and this optional record carries Supmea.
message FlowReading {
  float flow_rate = 1;
  float velocity = 2;
  float flow_rate_per_day = 3;
  float flow_rate_per_month = 4;
  float flow_rate_per_year = 5;
  uint32 flow_meter_type = 6;
  uint32 flow_period_source = 7;
  bool flow_live_valid = 8;
  bool flow_period_totals_valid = 9;
  bool flow_cumulative_totals_valid = 10;
  bool rtc_valid = 11;
  uint64 forward_total_liters = 12;
  uint64 reverse_total_liters = 13;
  sint64 net_total_liters = 14;
  uint32 flow_period_quality = 15;
  uint32 flow_meter_alarm_flags = 16;
}

message Status_Message {
  uint32 node_id = 1;
  uint32 sensor_id = 2;
  uint64 timestamp = 3;

  // Added in V1.1. Tag 19 preserves compatibility with deployed tags 4..18,
  // while nanopb still places this member directly after timestamp.
  float battery_voltage = 19;

  float flow_rate = 4;
  float velocity = 5;
  float flow_rate_per_day = 6;
  float flow_rate_per_month = 7;
  float flow_rate_per_year = 8;
  uint32 node_status = 9; // Valve: 0=commanded closed/OFF, 1=open/ON, 2=unknown, 3=fault (no feedback).
  float soil_temperature = 10;
  float soil_moisture = 11;
  uint32 soil_moisture_temp_valid = 12;
  float ec_temperature = 13;
  float ec_moisture = 14;
  float electrical_conductivity = 15;
  uint32 soil_moisture_temp_ec_valid = 16;
  uint32 active_sensor_count = 17;
  uint32 sensor_mask = 18;

  // Flow schema v2. Existing field numbers 1-19 remain wire-compatible.
  uint32 flow_meter_type = 20;              // 0=none, 1=TUF, 2=Supmea
  uint32 flow_period_source = 21;           // 1=meter native, 2=node RTC
  bool flow_live_valid = 22;
  bool flow_period_totals_valid = 23;
  bool flow_cumulative_totals_valid = 24;
  bool rtc_valid = 25;
  uint64 forward_total_liters = 26;
  uint64 reverse_total_liters = 27;
  sint64 net_total_liters = 28;
  uint32 flow_period_quality = 29;
  uint32 flow_meter_alarm_flags = 30;
  FlowReading secondary_flow_meter = 31;
  // Power v4: 0=unknown; 1=NORMAL, 2=RTC_PERIODIC, 3=REMOTE_WAKE,
  // 4=RTC_QUEUED, 5=LORA_WOR_STOP. Existing tag numbers are unchanged.
  uint32 power_mode = 32;
  uint32 power_state = 33;                 // 1=ACTIVE, 2=REACHABLE_IDLE
  uint32 wake_remaining_seconds = 34;      // active lease/window, not idle time
  uint32 wdt_reset_count = 35;             // cumulative hardware IWDG resets
  uint32 power_reset_count = 36;           // power-on/brownout; excludes Standby/software
  uint32 sample_sequence = 37;
  bool sample_time_valid = 38;
  bool stored_sample = 39;
  bool live_fallback = 40;
}

message CMD_Message {
  uint32 node_id = 1;
  uint32 cmd_id = 2;
  uint64 cmd_data = 3;
  uint32 request_id = 4;                   // WAKE correlation; 0=legacy/manual
}

message Telemetry {
  uint32 node_id = 1;
  uint64 timestamp = 2;
  uint32 sampling_rate = 3;
  uint32 Transmission_rate = 4;

  // V1 reserved1 was never assigned application data. Its tag is now the
  // battery voltage field requested for system telemetry.
  float battery_voltage = 5;

  uint32 reserved2 = 6;
  uint32 reserved3 = 7;
  uint32 active_sensor_count = 8;
  uint32 sensor_id = 9;
  float flow_rate = 10;
  float velocity = 11;
  float flow_rate_per_day = 12;
  float flow_rate_per_month = 13;
  float flow_rate_per_year = 14;
  uint32 node_status = 15; // Same valve codes as Status; never measured position.
  float soil_temperature = 16;
  float soil_moisture = 17;
  uint32 soil_moisture_temp_valid = 18;
  float ec_temperature = 19;
  float ec_moisture = 20;
  float electrical_conductivity = 21;
  uint32 soil_moisture_temp_ec_valid = 22;
  uint32 sensor_mask = 23;
  uint32 flow_meter_type = 24;
  uint32 flow_period_source = 25;
  bool flow_live_valid = 26;
  bool flow_period_totals_valid = 27;
  bool flow_cumulative_totals_valid = 28;
  bool rtc_valid = 29;
  uint64 forward_total_liters = 30;
  uint64 reverse_total_liters = 31;
  sint64 net_total_liters = 32;
  uint32 flow_period_quality = 33;
  uint32 flow_meter_alarm_flags = 34;
  FlowReading secondary_flow_meter = 35;
  uint32 power_mode = 36;
  uint32 power_state = 37;
  uint32 wake_remaining_seconds = 38;
  bool wake_command_ack = 39;              // explicit accepted WAKE response
  uint32 wake_request_id = 40;             // echoes CMD request_id on WAKE ACK
  uint32 command_ack_request_id = 41;      // nonzero queued command correlation
  uint32 command_ack_cmd_id = 42;          // command accepted by this node
  bool command_ack_success = 43;           // application-level confirmation
  uint32 wdt_reset_count = 44;             // cumulative hardware IWDG resets
  uint32 power_reset_count = 45;           // independently clearable power-on/brownout
  FlashLogInfo flash_log = 46;
  HistoryInfo history = 47;
  uint32 sample_sequence = 48;
  bool sample_time_valid = 49;
  bool stored_sample = 50;
  bool live_fallback = 51;
}
