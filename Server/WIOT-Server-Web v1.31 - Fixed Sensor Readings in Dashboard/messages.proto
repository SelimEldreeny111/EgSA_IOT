syntax = "proto3";

// Arduino/nanopb wire schema. Field numbers are part of the deployed V1
// protocol and must never be renumbered or reused.

// When both flow meters are enabled, the original flow fields carry TUF for
// backward compatibility, and this optional record carries Supmea.
message FlowReading {
  float flow_rate = 1;
  float velocity = 2;
  float flow_rate_per_day = 3;
  float flow_rate_per_month = 4;
  float flow_rate_per_year = 5;
  uint32 flow_meter_type = 6;
  uint32 flow_period_source = 7;
  bool flow_live_valid = 8;
  bool flow_period_totals_valid = 9;
  bool flow_cumulative_totals_valid = 10;
  bool rtc_valid = 11;
  uint64 forward_total_liters = 12;
  uint64 reverse_total_liters = 13;
  sint64 net_total_liters = 14;
  uint32 flow_period_quality = 15;
  uint32 flow_meter_alarm_flags = 16;
}

message Status_Message {
  uint32 node_id = 1;
  uint32 sensor_id = 2;
  uint64 timestamp = 3;

  // Added in V1.1. Tag 19 preserves compatibility with deployed tags 4..18,
  // while nanopb still places this member directly after timestamp.
  float battery_voltage = 19;

  float flow_rate = 4;
  float velocity = 5;
  float flow_rate_per_day = 6;
  float flow_rate_per_month = 7;
  float flow_rate_per_year = 8;
  uint32 node_status = 9;
  float soil_temperature = 10;
  float soil_moisture = 11;
  uint32 soil_moisture_temp_valid = 12;
  float ec_temperature = 13;
  float ec_moisture = 14;
  float electrical_conductivity = 15;
  uint32 soil_moisture_temp_ec_valid = 16;
  uint32 active_sensor_count = 17;
  uint32 sensor_mask = 18;

  // Flow schema v2. Existing field numbers 1-19 remain wire-compatible.
  uint32 flow_meter_type = 20;              // 0=none, 1=TUF, 2=Supmea
  uint32 flow_period_source = 21;           // 1=meter native, 2=node RTC
  bool flow_live_valid = 22;
  bool flow_period_totals_valid = 23;
  bool flow_cumulative_totals_valid = 24;
  bool rtc_valid = 25;
  uint64 forward_total_liters = 26;
  uint64 reverse_total_liters = 27;
  sint64 net_total_liters = 28;
  uint32 flow_period_quality = 29;
  uint32 flow_meter_alarm_flags = 30;
  FlowReading secondary_flow_meter = 31;
}

message CMD_Message {
  uint32 node_id = 1;
  uint32 cmd_id = 2;
  uint64 cmd_data = 3;
}

message Telemetry {
  uint32 node_id = 1;
  uint64 timestamp = 2;
  uint32 sampling_rate = 3;
  uint32 Transmission_rate = 4;

  // V1 reserved1 was never assigned application data. Its tag is now the
  // battery voltage field requested for system telemetry.
  float battery_voltage = 5;

  uint32 reserved2 = 6;
  uint32 reserved3 = 7;
  uint32 active_sensor_count = 8;
  uint32 sensor_id = 9;
  float flow_rate = 10;
  float velocity = 11;
  float flow_rate_per_day = 12;
  float flow_rate_per_month = 13;
  float flow_rate_per_year = 14;
  uint32 node_status = 15;
  float soil_temperature = 16;
  float soil_moisture = 17;
  uint32 soil_moisture_temp_valid = 18;
  float ec_temperature = 19;
  float ec_moisture = 20;
  float electrical_conductivity = 21;
  uint32 soil_moisture_temp_ec_valid = 22;
  uint32 sensor_mask = 23;
  uint32 flow_meter_type = 24;
  uint32 flow_period_source = 25;
  bool flow_live_valid = 26;
  bool flow_period_totals_valid = 27;
  bool flow_cumulative_totals_valid = 28;
  bool rtc_valid = 29;
  uint64 forward_total_liters = 30;
  uint64 reverse_total_liters = 31;
  sint64 net_total_liters = 32;
  uint32 flow_period_quality = 33;
  uint32 flow_meter_alarm_flags = 34;
  FlowReading secondary_flow_meter = 35;
}
