<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password — WIOT Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h5 mb-0"><i class="bi bi-shield-lock me-2"></i>Change Password</h1>
                <div>
                    <a href="/dashboard" class="btn btn-sm btn-outline-light"><i class="bi bi-arrow-left"></i> Back</a>
                    <a href="/logout" class="btn btn-sm btn-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
                </div>
            </div>

            {% if message %}
            <div class="alert alert-info d-flex align-items-center" role="alert">
                <i class="bi bi-info-circle me-2"></i>
                <div>{{ message }}</div>
            </div>
            {% endif %}

            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Old Password</label>
                    <input type="password" name="old_password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Password</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <div class="text-end">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle me-1"></i>Update Password</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
