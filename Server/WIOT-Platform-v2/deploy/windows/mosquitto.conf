# Production MQTT broker for WIOT Platform v2 on Windows (Eclipse Mosquitto 2.x).
#
# The field gateways keep publishing to broker.hivemq.com (built into their firmware). This broker
# bridges only the real companies' topics from and to HiveMQ, keeps queued messages on disk across
# restarts, and serves the platform locally. Replaces the Python development broker (devbroker).
#
# Install: copy this file to C:\Program Files\mosquitto\mosquitto.conf (keep the original as a backup),
# create C:\ProgramData\mosquitto, then restart the "Mosquitto Broker" Windows service.
# In the platform's .env:  WIOT_MQTT_HOST=127.0.0.1  WIOT_MQTT_PORT=1883  WIOT_MQTT_AUTOCONNECT=true

per_listener_settings true

# --- local listener: the platform only (loopback, no network exposure)
listener 1883 127.0.0.1
allow_anonymous true

# --- persistence and logs
persistence true
persistence_location C:\ProgramData\mosquitto\
autosave_interval 60
log_dest file C:\ProgramData\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
connection_messages true

# --- bridge to the public broker the field gateways use
connection wiot-hivemq
address broker.hivemq.com:1883
# A unique client ID on the shared public broker (change the suffix per installation).
remote_clientid wiot-egsa-bridge-01
bridge_protocol_version mqttv311
try_private false
cleansession true
notifications false
keepalive_interval 60
restart_timeout 10 60
# Real companies only: uplinks (status, data, command replies) come in, the platform's commands go out.
# QoS 0 like the nodes. Add one line per company whose gateways are in the field.
topic wiot/Company_1/# both 0
# topic wiot/Company_2/# both 0
